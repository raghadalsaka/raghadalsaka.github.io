- title: "QuizRush"
  url: "https://quizrush.raghadalsaka.com"
  summary: "A timed, team-based English quiz with a choice of quizzes: Present Perfect vs Past Simple, and Writing: Correct the Mistakes, where players pick the correctly edited version of a sentence. Teams take turns choosing the right answer against the clock, see the correct answer and a short explanation after every question, and follow their points on a live leaderboard."
  how_to_play: "Open the link in any web browser and choose a quiz. Enter 1 to 5 team names, choose how many questions each team gets and how many seconds each question lasts, and press Start Game. No download, account, or sign-in is needed, and nothing is saved."
- title: "QuestRush"
  url: "https://questrush.raghadalsaka.com"
  summary: "A treasure-map adventure for the whole class, where every island is a stage of Grade 6 English: Vocabulary Harbour, Tense Mountain, Relative Clause Castle, Project Crossroads, Message Bridge and Reading Lagoon. In class, the game picks a student at random to answer on the big screen, each correct answer earns a star, and the class flag moves from island to island. Every student can follow their own stars on the class map and practise any open island at home."
  how_to_play: "Open the link and pick your class. Tap your pawn to see your stars, or tap an open island to practise its questions; students need no account or sign-in."
