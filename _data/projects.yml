- title: "Classroom First Podcast Project"
  url: "https://mic.raghadalsaka.com/"
  summary: "A podcast project gives every student a chance to plan, speak, listen to themselves, and improve. Students record their podcasts with First Mic, a recorder made for the classroom. They choose a topic from their teacher, record a podcast of up to three minutes, listen back, and try again until they are happy with it. They can record on their own or with a partner: partners talk live from their own devices, and First Mic puts both voices together into one podcast. Every saved recording goes into the student's own My Recordings list, where they choose the one they like best and submit it to their teacher."
  button: "Open First Mic"
  notes:
    - label: "How to record"
      text: "Open the link and pick your class. Tap your name and type the PIN from your teacher, then choose a topic and pick On My Own or With a Partner. Tap Record, talk, and tap Stop. Listen to your recording, then tap Save, or Try Again to record it again. Open My Recordings and tap Submit to Teacher on the recording you want your teacher to hear."
    - label: "Recording with a partner"
      text: "One student picks With a Partner and gets a group PIN. The partner taps Join a Partner and types that PIN. Wear headphones so your partner's voice does not echo. When you tap Save for Both, each of you gets a copy in My Recordings and decides whether to submit it."
    - label: "Good to know"
      text: "Students need no download, email, or account, only their name and PIN. Recordings are private: each student sees only their own recordings (a partner podcast is shared by both partners), and the teacher hears only the recording each student submits. Students can change their submission until the teacher's deadline."
